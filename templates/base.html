<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ETNOART — Milliy Hunarmandchilik{% endblock %}</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #2c2926;
            --text-muted: #8c857b;
            --border-color: #eae5dc;
            --accent-color: #b85d33;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f1f1f1;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .card, .card-custom {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--border-color) !important;
        }

        .navbar-custom {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        body.dark-mode input, 
        body.dark-mode textarea, 
        body.dark-mode select {
            background-color: #2a2a2a !important;
            color: #ffffff !important;
            border-color: #444444 !important;
        }

        /* Bootstrap utility klasslari o'z ranglarini Bootstrap o'zgaruvchilaridan oladi,
           bizning --text-muted kabi custom o'zgaruvchilarni bilmaydi — shuning uchun
           dark mode uchun ularni alohida qayta belgilash kerak */
        body.dark-mode .text-muted {
            color: var(--text-muted) !important;
        }
        body.dark-mode .text-secondary {
            color: #b5b0a5 !important;
        }
        body.dark-mode .text-dark {
            color: var(--text-main) !important;
        }
        body.dark-mode h1, body.dark-mode h2, body.dark-mode h3,
        body.dark-mode h4, body.dark-mode h5, body.dark-mode h6 {
            color: var(--text-main);
        }

        /* Jadvallar (masalan admin panel mahsulotlar ro'yxati) */
        body.dark-mode .table {
            --bs-table-bg: var(--card-bg);
            --bs-table-color: var(--text-main);
            --bs-table-border-color: var(--border-color);
            color: var(--text-main);
        }
        body.dark-mode .table th {
            color: var(--text-muted);
            border-color: var(--border-color) !important;
        }
        body.dark-mode .table td {
            border-color: var(--border-color) !important;
        }

        /* Bootstrap'ning bg-light / bg-white klasslari */
        body.dark-mode .bg-light {
            background-color: #242424 !important;
            color: var(--text-main) !important;
        }
        body.dark-mode .bg-white {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
        }

        /* Chegaralar */
        body.dark-mode .border {
            border-color: var(--border-color) !important;
        }
        body.dark-mode hr {
            border-color: var(--border-color) !important;
            opacity: 0.5;
        }

        /* Konturli tugmalar */
        body.dark-mode .btn-outline-dark {
            color: var(--text-main) !important;
            border-color: #555555 !important;
        }
        body.dark-mode .btn-outline-dark:hover {
            background-color: #2a2a2a !important;
            color: #ffffff !important;
        }
        body.dark-mode .btn-outline-secondary {
            color: var(--text-main) !important;
            border-color: #555555 !important;
        }
        body.dark-mode .btn-outline-primary {
            color: var(--text-main) !important;
            border-color: #555555 !important;
        }

        /* Belgilar (badge) */
        body.dark-mode .badge.bg-secondary-subtle {
            background-color: #333333 !important;
            color: #dddddd !important;
        }
        body.dark-mode .badge.bg-light {
            background-color: #333333 !important;
            color: #dddddd !important;
        }

        /* Sidebar navigatsiya havolalari (agar mavjud bo'lsa) */
        body.dark-mode .nav-link {
            color: var(--text-muted);
        }
        body.dark-mode .nav-link:hover,
        body.dark-mode .nav-link.active {
            background-color: #242424;
            color: #ffffff;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Navigatsiya paneli -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-decoration-none" href="/" style="color: var(--text-main);">🎨 ETNOART</a>
            
            <div class="d-flex align-items-center gap-2 ms-auto">
                <!-- Valyuta tanlash Menyusi (Live) -->
                <select id="currencySelect" onchange="changeCurrency(this.value)" class="form-select form-select-sm fw-bold border-secondary-subtle" style="width: auto; cursor: pointer;">
                    <option value="UZS">UZS (so'm)</option>
                    <option value="USD">USD ($)</option>
                    <option value="RUB">RUB (₽)</option>
                    <option value="CNY">CNY (¥)</option>
                </select>

                <!-- Dark Mode Tugmasi -->
                <button id="theme-toggle" onclick="toggleTheme()" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-bold">
                    🌙 Tungi
                </button>
            </div>
        </div>
    </nav>

    <!-- Asosiy Kontent Bloki -->
    <main class="py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. Live Valyuta Kurslari (API va Mantiq)
        let exchangeRates = { 'UZS': 1, 'USD': 0.000079, 'RUB': 0.0071, 'CNY': 0.00057 }; // Zaxira kurslar
        const currencySymbols = { 'UZS': "so'm", 'USD': '$', 'RUB': '₽', 'CNY': '¥' };

        async function fetchLiveRates() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/UZS');
                const data = await res.json();
                if (data && data.rates) {
                    exchangeRates = data.rates;
                    const savedCurrency = localStorage.getItem('etno_currency') || 'UZS';
                    changeCurrency(savedCurrency);
                }
            } catch (err) {
                console.log("Kurslarni yuklashda xatolik:", err);
            }
        }

        function changeCurrency(selectedCurrency) {
            localStorage.setItem('etno_currency', selectedCurrency);
            
            // Barcha .product-price sinfiga ega narx elementlarini topib o'zgartirish
            const priceElements = document.querySelectorAll('.product-price');
            
            priceElements.forEach(el => {
                const basePriceUZS = parseFloat(el.getAttribute('data-price-uzs'));
                if (!isNaN(basePriceUZS)) {
                    const converted = basePriceUZS * exchangeRates[selectedCurrency];
                    const symbol = currencySymbols[selectedCurrency];
                    
                    if (selectedCurrency === 'UZS') {
                        el.innerText = `${Math.round(converted).toLocaleString()} ${symbol}`;
                    } else {
                        el.innerText = `${symbol}${converted.toFixed(2)}`;
                    }
                }
            });
        }

        // 2. Dark Mode Mantiqi
        function applyTheme(theme) {
            const toggleBtn = document.getElementById('theme-toggle');
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                if (toggleBtn) toggleBtn.innerHTML = '☀️ Kunduzgi';
            } else {
                document.body.classList.remove('dark-mode');
                if (toggleBtn) toggleBtn.innerHTML = '🌙 Tungi';
            }
        }

        function toggleTheme() {
            const currentTheme = localStorage.getItem('etno_theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('etno_theme', newTheme);
            applyTheme(newTheme);
        }

        // Sahifa yuklanganda ishga tushishi kerak bo'lgan funksiyalar
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('etno_theme') || 'light';
            applyTheme(savedTheme);

            const savedCurrency = localStorage.getItem('etno_currency') || 'UZS';
            const currencySelect = document.getElementById('currencySelect');
            if (currencySelect) {
                currencySelect.value = savedCurrency;
            }
            
            fetchLiveRates(); // API orqali yangi kurslarni tortish
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
<!-- new -->
