<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ETNOART — Milliy Hunarmandchilik{% endblock %}</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f7f5f0;
            --card-bg: #ffffff;
            --text-main: #2c2926;
            --text-muted: #8c857b;
            --border-color: #eae5dc;
            --accent-color: #b85d33;
        }

        /* Dark Mode o'zgaruvchilari */
        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f1f1f1;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .card, .card-custom {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--border-color) !important;
        }

        .navbar-custom {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        /* Dark mode rejimidagi input va matnlar */
        body.dark-mode input, 
        body.dark-mode textarea, 
        body.dark-mode select {
            background-color: #2a2a2a !important;
            color: #ffffff !important;
            border-color: #444444 !important;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Navigatsiya paneli -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-decoration-none" href="/" style="color: var(--text-main);">🎨 ETNOART</a>
            
            <div class="d-flex align-items-center gap-3">
                <a href="/artisans" class="btn btn-link text-decoration-none p-0 me-2" style="color: var(--text-main);">Ustalar</a>
                <!-- Dark Mode Tugmasi -->
                <button id="theme-toggle" onclick="toggleTheme()" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-bold">
                    🌙 Tungi
                </button>
            </div>
        </div>
    </nav>

    <!-- Asosiy Kontent Bloki -->
    <main class="py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // LocalStorage orqali Dark Mode holatini boshqarish
        function applyTheme(theme) {
            const toggleBtn = document.getElementById('theme-toggle');
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                if (toggleBtn) toggleBtn.innerHTML = '☀️ Kunduzgi';
            } else {
                document.body.classList.remove('dark-mode');
                if (toggleBtn) toggleBtn.innerHTML = '🌙 Tungi';
            }
        }

        function toggleTheme() {
            const currentTheme = localStorage.getItem('etno_theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('etno_theme', newTheme);
            applyTheme(newTheme);
        }

        // Sahifa yuklanganda saqlangan rejimni tiklash
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('etno_theme') || 'light';
            applyTheme(savedTheme);
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
